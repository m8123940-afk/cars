<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Rivals — админ-панель</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#15171c;color:#f2efe6;padding:20px;max-width:900px;margin:auto}
h1{font-size:22px;border-bottom:3px dashed #f5c542;padding-bottom:10px}
.card{background:#ffffff12;border:1px solid #ffffff2a;border-radius:8px;padding:14px;margin:12px 0}
input,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #ffffff3a;background:#ffffff14;color:inherit}
button{cursor:pointer}button.p{background:#ff6a1a;color:#111;border:0}button.d{color:#ff7070}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #ffffff1a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{opacity:.7}
</style></head><body>
<h1>Turbo Rivals — админ-панель</h1>
<div class="card row"><input id="pw" type="password" placeholder="Пароль администратора"><button class="p" id="login">Войти</button><span id="msg" class="muted"></span></div>
<div id="panel" hidden>
  <div class="card row"><b id="stats"></b><span class="muted" id="maint"></span><button id="mt">Тех. работы вкл/выкл</button></div>
  <div class="card"><b>Объявление всем игрокам</b><div class="row" style="margin-top:8px"><input id="bc" maxlength="120" style="flex:1;min-width:200px" placeholder="Текст"><button class="p" id="bcb">Отправить</button></div></div>
  <div class="card"><b>Игроки онлайн</b><table id="pl"></table></div>
  <div class="card"><b>Комнаты</b><table id="rm"></table></div>
  <div class="card"><b>Блокировки</b><div class="row" style="margin:8px 0"><input id="bn" placeholder="Имя"><button id="bnb" class="d">Заблокировать</button></div><div id="bl" class="muted"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let pw=sessionStorage.getItem('apw')||'';let timer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,body){const r=await fetch('/admin/api/'+p,{method:body?'POST':'GET',headers:{'x-admin-pass':pw,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error('Неверный пароль или слишком много попыток');return r.json();}
async function refresh(){try{const s=await api('state');$('panel').hidden=false;$('msg').textContent='';
$('stats').textContent='Онлайн: '+s.online+' · в очереди: '+s.queue;$('maint').textContent=s.maintenance?'ТЕХ. РАБОТЫ ВКЛЮЧЕНЫ':'';
$('pl').innerHTML='<tr><th>ID</th><th>Имя</th><th>Машина</th><th>Статус</th><th></th></tr>'+s.players.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.car)}</td><td>${p.room?'комната '+p.room:p.inQueue?'очередь':'меню'}</td><td><button class="d" onclick="act('kick',{id:${p.id}})">Кик</button></td></tr>`).join('');
$('rm').innerHTML='<tr><th>ID</th><th>Трасса</th><th>Игроки</th><th></th></tr>'+s.rooms.map(r=>`<tr><td>${r.id}</td><td>${r.L}</td><td>${r.players.map(esc).join(', ')}</td><td><button class="d" onclick="act('closeRoom',{id:${r.id}})">Закрыть</button></td></tr>`).join('');
$('bl').innerHTML=s.banned.map(n=>esc(n)+' <a href="#" onclick="act(\'unban\',{name:\''+esc(n)+'\'});return false">разблок.</a>').join(' · ')||'нет';
}catch(e){$('msg').textContent=e.message;$('panel').hidden=true;clearInterval(timer);}}
async function act(p,b){await api(p,b);refresh();}
$('login').onclick=()=>{pw=$('pw').value;sessionStorage.setItem('apw',pw);clearInterval(timer);refresh();timer=setInterval(refresh,3000);};
$('bcb').onclick=()=>{if($('bc').value.trim())act('broadcast',{text:$('bc').value});$('bc').value='';};
$('bnb').onclick=()=>{if($('bn').value.trim())act('ban',{name:$('bn').value});$('bn').value='';};
$('mt').onclick=async()=>{const s=await api('state');act('maintenance',{on:!s.maintenance});};
if(pw){refresh();timer=setInterval(refresh,3000);}
</script></body></html>
